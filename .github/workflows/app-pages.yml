name: EasyVoca app CI and Pages
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/compile-content.mjs"
      - "content/data/**"
      - "index.html"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/app-pages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck and build (validates 64 batches and 5111 items)
        run: npm run build
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://totoro0419.github.io/easyvoca/
    steps:
      - uses: actions/deploy-pages@v4
